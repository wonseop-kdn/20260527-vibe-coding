<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업관리 시스템</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<!-- ── App Shell ── -->
<div id="app" class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="10" fill="url(#brandGrad)"/>
          <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs>
          <path d="M8 10h16M8 16h10M8 22h13" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">사업관리</div>
        <div class="brand-sub">Business Management</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">메인</div>
      <a class="nav-item active" data-page="dashboard" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/></svg>
        <span>대시보드</span>
      </a>

      <div class="nav-section-label">사업 관리</div>
      <a class="nav-item" data-page="projects-수주" href="#">
        <span class="nav-phase-dot blue"></span>
        <span>수주</span>
        <span class="nav-count" id="cnt-수주"></span>
      </a>
      <a class="nav-item" data-page="projects-발주" href="#">
        <span class="nav-phase-dot green"></span>
        <span>발주</span>
        <span class="nav-count" id="cnt-발주"></span>
      </a>
      <a class="nav-item" data-page="projects-청구" href="#">
        <span class="nav-phase-dot amber"></span>
        <span>청구</span>
        <span class="nav-count" id="cnt-청구"></span>
      </a>

      <div class="nav-section-label">설정</div>
      <a class="nav-item" data-page="regulations" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
        <span>사규 / 결재규정</span>
      </a>
      <a class="nav-item" data-page="templates" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/></svg>
        <span>프로세스 템플릿</span>
      </a>
      <a class="nav-item" data-page="settings" href="#">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
        <span>알림 설정</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-new-project" id="btn-new-project">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
        새 사업 등록
      </button>
      <div id="db-status" class="db-badge db-local">● localStorage 모드</div>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="main-area" id="main-area">
    <!-- Topbar -->
    <header class="topbar">
      <button class="topbar-menu" id="sidebar-toggle" aria-label="메뉴">
        <svg viewBox="0 0 20 20" fill="currentColor" width="18"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
      </button>
      <nav class="breadcrumb" id="breadcrumb">
        <span>대시보드</span>
      </nav>
      <div class="topbar-right">
        <button class="topbar-icon-btn" id="notif-btn" title="알림">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18"><path d="M10 2a6 6 0 00-6 6v3.586l-.707.707A1 1 0 004 14h12a1 1 0 00.707-1.707L16 11.586V8a6 6 0 00-6-6zM10 18a3 3 0 01-3-3h6a3 3 0 01-3 3z"/></svg>
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </button>
        <button class="topbar-icon-btn" onclick="App.exportData()" title="데이터 내보내기">
          <svg viewBox="0 0 20 20" fill="currentColor" width="18"><path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>
    </header>

    <!-- Alert strip -->
    <div class="alert-strip" id="alert-strip" style="display:none"></div>

    <!-- Page content -->
    <main class="page-content" id="page-content"></main>
  </div>
</div>

<!-- ── Modal ── -->
<div class="modal-backdrop" id="modal-backdrop" style="display:none">
  <div class="modal-box" id="modal-box">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-x" id="modal-close">
        <svg viewBox="0 0 20 20" fill="currentColor" width="18"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ── Toast stack ── -->
<div class="toast-stack" id="toast-stack"></div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/data.js"></script>
<script src="js/spec.js"></script>
<script src="js/approval.js"></script>
<script src="js/app.js"></script>
</body>
</html>
